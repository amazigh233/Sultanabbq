<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sultana BBQ Utrecht Overvecht | Halal BBQ en grillrestaurant</title>
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0D0D0D" />
    <base href="/" />

    <style>
        :root{--color-bg:#0D0D0D;--color-gold:#D4A853;--color-cream:#F5F0E8;--color-cream-muted:#C8C2B8;--font-serif:'Playfair Display',Georgia,serif;--font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
        *{box-sizing:border-box}
        body{margin:0;background:var(--color-bg);color:var(--color-cream);font-family:var(--font-sans);line-height:1.6;-webkit-font-smoothing:antialiased}
        .hero{position:relative;min-height:100svh;display:flex;align-items:center;overflow:hidden;isolation:isolate;padding:clamp(7rem,14vh,10rem) 2rem clamp(7.5rem,14vh,10rem);background:#080705}
        .hero::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(7,6,5,.92),rgba(9,8,7,.78) 36%,rgba(9,8,7,.34) 68%,rgba(9,8,7,.72)),linear-gradient(180deg,rgba(7,6,5,.62),rgba(7,6,5,.18) 42%,rgba(7,6,5,.92))}
        .hero-bg{position:absolute;inset:0;z-index:0;background-image:linear-gradient(135deg,rgba(20,12,6,.85),rgba(5,5,5,.95)),url('images/order/grill-platter.jpg');background-image:linear-gradient(135deg,rgba(20,12,6,.85),rgba(5,5,5,.95)),image-set(url('images/order/grill-platter.webp') type('image/webp'),url('images/order/grill-platter.jpg') type('image/jpeg'));background-position:center;background-size:cover}
        .hero-content{position:relative;z-index:3;width:min(100%,1400px);max-width:1400px;margin:0 auto;padding:0 2rem}
        .hero-subtitle{display:inline-flex;align-items:center;gap:.8rem;margin:0 0 1.4rem;color:#f0c46b;font-weight:700;font-size:clamp(.72rem,1vw,.86rem);letter-spacing:.24em;text-transform:uppercase}
        .hero-title{max-width:9ch;margin:0 0 .4rem;color:#fff8ec;font-family:var(--font-serif);font-size:clamp(4.3rem,11vw,10.5rem);font-weight:900;line-height:.82;letter-spacing:0;text-shadow:0 1.4rem 4rem rgba(0,0,0,.48);opacity:1;transform:none}
        .hero-tagline{margin:0 0 1.2rem;color:#f0c46b;font-family:var(--font-serif);font-size:clamp(1.45rem,3vw,3rem);font-style:italic}
        .hero-description{max-width:680px;margin:0 0 2.2rem;color:rgba(245,240,232,.84);font-size:clamp(1.02rem,1.35vw,1.32rem)}
        .hero-cta{display:flex;gap:1rem;flex-wrap:wrap}
        .btn-primary,.btn-outline{display:inline-flex;align-items:center;justify-content:center;min-height:3.55rem;padding:1rem 2.5rem;border-radius:999px;font-weight:600;font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
        .btn-primary{background:linear-gradient(135deg,#f0c46b,#c88935);color:#0D0D0D}.btn-outline{border:1px solid rgba(255,248,236,.42);color:#fff8ec;background:rgba(255,255,255,.06)}
        @media(max-width:520px){.hero{align-items:flex-end;padding:6.5rem 1rem 7rem}.hero-content{padding:0}.hero-title{font-size:clamp(3.2rem,20vw,5.2rem)}.hero-cta .btn-primary,.hero-cta .btn-outline{width:100%}}
    </style>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Styles -->
    <link rel="preload" as="image" href="images/order/grill-platter.webp" type="image/webp" fetchpriority="high" />
    <link rel="stylesheet" href="css/app.min.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <section class="hero" id="home">
            <div class="hero-bg" aria-hidden="true"></div>
            <div class="hero-content">
                <p class="hero-subtitle">Halal BBQ &amp; Grill in Utrecht</p>
                <h1 class="hero-title">Sultana BBQ</h1>
                <p class="hero-tagline">Fire, Smoke &amp; Family Dining</p>
                <p class="hero-description">
                    Ervaar authentieke grillgerechten, warme gastvrijheid en een gezellige sfeer
                    voor familie en vrienden.
                </p>
                <div class="hero-cta">
                    <a class="btn-primary" href="/reserveren"><span>Reserveer tafel</span></a>
                    <a class="btn-outline" href="/menu"><span>Bekijk menu</span></a>
                </div>
            </div>
        </section>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Critical interop only; animations and 3D are loaded after initial render. -->
    <script defer src="js/blazor-interop.min.js"></script>

    <script defer src="_framework/blazor.webassembly.js"></script>
</body>

</html>
